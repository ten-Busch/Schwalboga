<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Jeopardy Deluxe – Offline</title>
<style>
:root{
  --bg: #eaf4ff; --text:#0b1a2e; --card:#1e68c7; --card-dark:#0f3a78;
  --col-head-grad: linear-gradient(180deg,#0f3a78,#0c2f63);
  --btn:#0f3a78; --btn-2:#2386e0; --accent:#f4c542; --good:#34d399; --bad:#ef4444;
  --modal-bg:#ffffff; --muted:#2a3d5b;
}
body[data-theme="dark"]{
  --bg:#0b1226; --text:#e8f0ff; --card:#1e64b8; --card-dark:#0d2d55;
  --col-head-grad: linear-gradient(180deg,#0d2d55,#0a2242);
  --btn:#0d2d55; --btn-2:#2f86da; --accent:#ffd46a; --good:#46e6ad; --bad:#ff6666;
  --modal-bg:#0f233e; --muted:#b6c7e6;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:
    var(--bg)
    url('https://assets.pokemon.com//assets/cms2/img/misc/virtual-backgrounds/pokemon/detective-pikachu.jpg')
    center center / cover
    fixed
    no-repeat;
  color:var(--text);
  font-family:Inter,system-ui,Arial,sans-serif;
}

/* Header + Theme Toggle */
header{
  position:relative;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  padding:12px 16px;
  background:var(--card-dark);
  color:#fff;
  font-weight:800;
}
.header-left{display:flex;flex-direction:column;align-items:flex-start;gap:8px;position:relative;z-index:1}
.mode-controls{display:flex;flex-direction:row;align-items:center;gap:8px}
.header-center{
  position:absolute;
  left:50%;
  top:14px;
  transform:translateX(-50%);
  z-index:0;
}
#boardModeIndicator{
  min-width:132px;
  padding:10px 18px;
  border-radius:999px;
  text-align:center;
  letter-spacing:.08em;
  text-transform:uppercase;
  font-size:14px;
  color:#eef6ff;
  background:linear-gradient(180deg, rgba(68,152,242,.34), rgba(20,80,153,.28));
  border:1px solid rgba(145,204,255,.35);
  box-shadow:0 0 18px rgba(65,150,245,.18);
  text-shadow:0 0 8px rgba(0,0,0,.24);
}
body[data-board-mode="challenge"] #boardModeIndicator{
  color:#fff3f3;
  background:linear-gradient(180deg, rgba(212,53,53,.34), rgba(109,11,25,.3));
  border-color:rgba(255,130,130,.38);
  box-shadow:0 0 18px rgba(217,44,44,.24);
}
#modeToggleBtn{
  position:relative;
  width:108px;
  height:66px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:16px;
  background:linear-gradient(180deg, rgba(50,138,219,.95), rgba(18,78,146,.92));
  box-shadow:0 12px 28px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.12);
  cursor:pointer;
  color:#fff;
  overflow:hidden;
}
#modeToggleBtn .mode-art{
  position:relative;
  width:100%;
  height:100%;
  display:block;
}
#modeToggleBtn .art-single,
#modeToggleBtn .art-multi{
  position:absolute;
  inset:0;
  display:none;
}
body[data-mode="singleplayer"] #modeToggleBtn .art-single{display:block}
body[data-mode="multiplayer"] #modeToggleBtn .art-multi{display:block}
.mode-icon-main{
  position:absolute;
  font-size:34px;
  line-height:1;
}
.mode-icon-main.left{left:10px; top:14px}
.mode-icon-main.right{right:10px; top:14px}
.mode-accent{
  position:absolute;
  font-size:16px;
  line-height:1;
}
.art-single .mode-icon-main{left:18px; top:12px}
.art-single .mode-accent{left:48px; top:19px}
.art-multi .mode-accent.plus{left:26px; top:33px; color:#ff6262}
.art-multi .mode-accent.minus{right:24px; top:33px; color:#6fd2ff}
.mode-label{
  position:absolute;
  right:8px;
  bottom:6px;
  font-size:11px;
  letter-spacing:.04em;
  opacity:.88;
}
#challengeToggleBtn{
  position:relative;
  width:108px;
  height:66px;
  padding:0;
  border:1px solid rgba(255,255,255,.2);
  border-radius:16px;
  background:transparent;
  box-shadow:0 12px 28px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.12);
  color:#fff;
  cursor:pointer;
  overflow:hidden;
  appearance:none;
  -webkit-appearance:none;
}
#challengeToggleBtn .challenge-toggle-inner{
  position:relative;
  width:100%;
  height:100%;
  display:block;
}
.challenge-face{
  position:absolute;
  inset:0;
  display:block;
  overflow:hidden;
}
.challenge-art{
  position:relative;
  width:100%;
  height:100%;
  display:block;
}
.challenge-icon-main{
  position:absolute;
  left:18px;
  top:12px;
  font-size:34px;
  line-height:1;
  font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
}
.challenge-label{
  position:absolute;
  right:8px;
  bottom:6px;
  font-size:11px;
  letter-spacing:.04em;
  opacity:.88;
  white-space:nowrap;
  text-shadow:0 1px 4px rgba(0,0,0,.35);
}
.challenge-face.challenge-normal{
  background:linear-gradient(180deg, #3290f5, #1559ad);
  display:block;
}
.challenge-face.challenge-active{
  background:linear-gradient(180deg, #ff6b6b, #b3162c);
  display:none;
}
body[data-board-mode="challenge"] .challenge-face.challenge-normal{display:none}
body[data-board-mode="challenge"] .challenge-face.challenge-active{display:block}
#themeToggle{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.switch{position:relative;width:54px;height:28px;background:#7aa7e0;border-radius:999px;cursor:pointer}
.switch input{display:none}
.switch .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;background:#fff;border-radius:50%}
.switch input:checked + .knob{left:29px}

/* Players */
#players{display:flex;gap:16px;align-items:center;justify-content:center;padding:12px 16px}
.player-wrap{position:relative;display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.15);padding:8px 12px;border-radius:12px}
.player-input{padding:8px 10px;border-radius:10px;border:1px solid #c9d6ee;background:#fff;min-width:180px}
body[data-theme="dark"] .player-input{background:#0f203a;color:#e8f0ff;border-color:#28456f}
.score-badge{background:var(--card-dark);color:#fff;padding:8px 12px;border-radius:12px;font-weight:800;min-width:70px;text-align:center}
.highscore-badge{
  background:rgba(11,26,46,.78);
  color:#fff;
  padding:8px 14px;
  border-radius:12px;
  font-weight:800;
  border:1px solid rgba(244,197,66,.45);
  box-shadow:0 0 14px rgba(244,197,66,.18);
}
body[data-theme="dark"] .highscore-badge{
  background:rgba(15,35,62,.86);
}
.player-wrap.singleplayer-disabled{
  opacity:1;
  filter:none;
  width:0;
  min-width:0;
  padding:0;
  gap:0;
  background:transparent;
  overflow:visible;
}
.player-wrap.singleplayer-disabled .player-input{
  pointer-events:none;
  display:none;
}
.player-wrap.singleplayer-disabled .score-badge{
  display:none;
}
.single-streak-display{
  display:none;
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-60%);
  min-width:92px;
  padding:8px 12px;
  border-radius:14px;
  background:linear-gradient(180deg, rgba(255,230,120,.22), rgba(255,184,0,.12));
  border:1px solid rgba(255,214,90,.45);
  color:#fff4c7;
  font-weight:900;
  text-align:center;
  box-shadow:0 0 18px rgba(255,210,70,.22);
  z-index:6;
  pointer-events:none;
}
.single-streak-value{
  display:block;
  font-size:28px;
  line-height:1;
}
.single-streak-label{
  display:block;
  margin-top:4px;
  font-size:11px;
  letter-spacing:.06em;
  text-transform:uppercase;
  opacity:.9;
}
.player-wrap.singleplayer-disabled .single-streak-display{
  display:block;
}
.player-active{outline:3px solid var(--accent); box-shadow:0 0 16px rgba(244,197,66,.6);border-radius:14px}
.combo-badge{
  position:absolute;
  left:-6px;
  top:-10px;
  display:none;
  padding:3px 8px;
  border-radius:10px;
  font-size:11px;
  font-weight:900;
  transform:rotate(45deg);
  transform-origin:left top;
  pointer-events:none;
  text-shadow:0 0 6px rgba(0,0,0,.35);
  z-index:3;
}
.combo-badge.show{display:block}
.combo-badge::before,
.combo-badge::after{
  content:'';
  position:absolute;
  opacity:0;
  pointer-events:none;
}
@keyframes comboShakeSlow {
  0%,100%{ transform:rotate(45deg) translate(0,0); }
  25%{ transform:rotate(45deg) translate(1px,-1px); }
  50%{ transform:rotate(45deg) translate(-1px,1px); }
  75%{ transform:rotate(45deg) translate(1px,1px); }
}
@keyframes comboShakeMed {
  0%,100%{ transform:rotate(45deg) translate(0,0); }
  20%{ transform:rotate(45deg) translate(1px,-1px); }
  40%{ transform:rotate(45deg) translate(-2px,1px); }
  60%{ transform:rotate(45deg) translate(2px,1px); }
  80%{ transform:rotate(45deg) translate(-1px,-1px); }
}
@keyframes comboShakeFast {
  0%,100%{ transform:rotate(45deg) translate(0,0); }
  20%{ transform:rotate(45deg) translate(2px,-2px); }
  40%{ transform:rotate(45deg) translate(-2px,1px); }
  60%{ transform:rotate(45deg) translate(2px,2px); }
  80%{ transform:rotate(45deg) translate(-1px,-2px); }
}
@keyframes comboFlash {
  0%,100%{ color:#ffe56d; text-shadow:0 0 10px rgba(255,229,109,.7); }
  50%{ color:#67d7ff; text-shadow:0 0 10px rgba(103,215,255,.7); }
}
@keyframes comboSparkleSmall {
  0%,100%{ opacity:0; transform:translate(0,0) scale(.7); }
  25%{ opacity:.9; transform:translate(8px,-10px) scale(1); }
  50%{ opacity:0; transform:translate(14px,-16px) scale(.7); }
}
@keyframes comboSparkleBig {
  0%,100%{ opacity:0; transform:translate(0,0) scale(.6); }
  30%{ opacity:.95; transform:translate(18px,-12px) scale(1.15); }
  60%{ opacity:0; transform:translate(24px,-18px) scale(.75); }
}
@keyframes comboAuraPulse {
  0%,100%{ box-shadow:0 0 10px rgba(255,230,70,.14), 0 0 20px rgba(103,215,255,.08); }
  50%{ box-shadow:0 0 14px rgba(255,230,70,.24), 0 0 28px rgba(103,215,255,.14); }
}
@keyframes comboPopBurst {
  0%,100%{ opacity:0; transform:translate(0,0) scale(.65); text-shadow:none; }
  25%{ opacity:.95; transform:translate(0,-4px) scale(1); text-shadow:12px -8px 0 rgba(255,231,91,.85), -10px -6px 0 rgba(103,215,255,.75), 4px 10px 0 rgba(255,255,255,.6); }
  60%{ opacity:0; transform:translate(2px,-8px) scale(1.15); text-shadow:18px -12px 0 rgba(255,231,91,0), -16px -10px 0 rgba(103,215,255,0), 7px 14px 0 rgba(255,255,255,0); }
}
@keyframes comboCornerSpark {
  0%,100%{ opacity:0; transform:translate(0,0) scale(.6); }
  30%{ opacity:.9; transform:translate(-10px,-12px) scale(1); }
  60%{ opacity:0; transform:translate(-16px,-18px) scale(.7); }
}
.combo-1{ color:#b85a00; }
.combo-2{ color:#d77400; animation:comboShakeSlow 1.8s infinite; }
.combo-3{ color:#ff8c00; animation:comboShakeMed 1.2s infinite; }
.combo-4{ color:#b6a300; animation:comboShakeMed .95s infinite; }
.combo-4::before{
  content:'✨';
  right:-8px;
  top:-10px;
  font-size:10px;
  animation:comboSparkleSmall 2.4s infinite;
}
.combo-5{ color:#d8c200; animation:comboShakeMed .85s infinite; }
.combo-5::before{
  content:'✨';
  right:-8px;
  top:-10px;
  font-size:10px;
  animation:comboSparkleSmall 1.7s infinite;
}
.combo-6{ color:#ffe600; animation:comboShakeFast .72s infinite; }
.combo-6::before{
  content:'✨';
  right:-8px;
  top:-10px;
  font-size:10px;
  animation:comboSparkleSmall 1.2s infinite;
}
.combo-7,
.combo-8,
.combo-9{
  animation:comboShakeFast .62s infinite, comboFlash 1.4s infinite;
}
.combo-7::before,
.combo-8::before,
.combo-9::before{
  content:'✨';
  right:-8px;
  top:-10px;
  font-size:10px;
  animation:comboSparkleSmall 1.05s infinite;
}
.combo-7::after,
.combo-8::after,
.combo-9::after{
  content:'🌟';
  left:72%;
  top:-14px;
  font-size:14px;
  animation:comboSparkleBig 2.1s infinite;
}
.combo-8{
  animation:comboShakeFast .5s infinite, comboFlash .95s infinite;
}
.combo-8::after{ animation:comboSparkleBig 1.35s infinite; }
.combo-9{
  animation:comboShakeFast .45s infinite, comboFlash .95s infinite;
}
.combo-9::before{ animation:comboSparkleSmall .65s infinite; }
.combo-9::after{
  font-size:16px;
  animation:comboSparkleBig .95s infinite;
}
.combo-10,
.combo-11,
.combo-12{
  color:#fff06a;
  animation:comboShakeFast .42s infinite, comboFlash .9s infinite, comboAuraPulse 2.1s infinite;
  box-shadow:0 0 12px rgba(255,230,70,.18), 0 0 22px rgba(103,215,255,.1);
}
.combo-10::before,
.combo-11::before,
.combo-12::before{
  content:'✨';
  right:-10px;
  top:-10px;
  font-size:11px;
  animation:comboSparkleSmall .62s infinite;
}
.combo-10::after,
.combo-11::after,
.combo-12::after{
  content:'🌟';
  left:68%;
  top:-15px;
  font-size:16px;
  animation:comboSparkleBig .88s infinite;
}
.combo-11::after{ animation:comboSparkleBig .78s infinite; }
.combo-12::after{ animation:comboSparkleBig .7s infinite; }

.combo-13,
.combo-14,
.combo-15,
.combo-16{
  color:#fff59a;
  animation:comboShakeFast .4s infinite, comboFlash .88s infinite, comboAuraPulse 1.8s infinite;
  box-shadow:0 0 15px rgba(255,232,85,.24), 0 0 28px rgba(103,215,255,.14);
  text-shadow:0 0 8px rgba(255,248,165,.42), 0 0 16px rgba(103,215,255,.18);
}
.combo-13::before,
.combo-14::before,
.combo-15::before,
.combo-16::before{
  content:'✨';
  right:-10px;
  top:-10px;
  font-size:11px;
  animation:comboSparkleSmall .56s infinite;
}
.combo-13::after,
.combo-14::after,
.combo-15::after,
.combo-16::after{
  content:'🌟';
  left:70%;
  top:-16px;
  font-size:16px;
  animation:comboPopBurst 1.15s infinite;
}
.combo-15::after,
.combo-16::after{
  font-size:17px;
  animation:comboPopBurst .95s infinite;
}

.combo-17,
.combo-18,
.combo-19,
.combo-20{
  color:#fff8b8;
  animation:comboShakeFast .38s infinite, comboFlash .82s infinite, comboAuraPulse 1.55s infinite;
  box-shadow:0 0 18px rgba(255,235,105,.28), 0 0 34px rgba(103,215,255,.17);
  text-shadow:0 0 10px rgba(255,248,189,.48), 0 0 20px rgba(103,215,255,.22), -10px -10px 0 rgba(255,255,255,.08), 12px -8px 0 rgba(255,240,150,.1);
}
.combo-17::before,
.combo-18::before,
.combo-19::before,
.combo-20::before{
  content:'✨';
  left:-5px;
  top:-8px;
  font-size:11px;
  animation:comboCornerSpark .72s infinite;
}
.combo-17::after,
.combo-18::after,
.combo-19::after,
.combo-20::after{
  content:'🌟';
  right:-10px;
  top:-14px;
  font-size:17px;
  animation:comboPopBurst .82s infinite;
}
.combo-19::after,
.combo-20::after{
  font-size:18px;
  animation:comboPopBurst .7s infinite;
}

.combo-21,
.combo-22,
.combo-23,
.combo-24,
.combo-25{
  color:#fffde0;
  animation:comboShakeFast .36s infinite, comboFlash .78s infinite, comboAuraPulse 1.3s infinite;
  box-shadow:0 0 20px rgba(255,239,130,.34), 0 0 40px rgba(103,215,255,.22);
  text-shadow:0 0 10px rgba(255,252,215,.58), 0 0 22px rgba(103,215,255,.28), -12px -12px 0 rgba(255,255,255,.1), 14px -10px 0 rgba(255,240,150,.13), -8px 10px 0 rgba(103,215,255,.1);
}
.combo-21::before,
.combo-22::before,
.combo-23::before,
.combo-24::before,
.combo-25::before{
  content:'✨';
  left:-6px;
  top:-10px;
  font-size:12px;
  animation:comboCornerSpark .5s infinite;
}
.combo-21::after,
.combo-22::after,
.combo-23::after,
.combo-24::after,
.combo-25::after{
  content:'🌟';
  right:-12px;
  top:-16px;
  font-size:18px;
  animation:comboPopBurst .62s infinite;
}
.combo-24::after,
.combo-25::after{
  font-size:19px;
  animation:comboPopBurst .54s infinite;
}

/* Dropdown */
#categorySelectors {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
  justify-content: center;
  align-items: center;
  max-width: 70%; /* exakt wie das Board */
  margin: 0 auto 10px;
  padding: 0;
}
body[data-board-mode="challenge"] #categorySelectors{display:none}

.cat-select {
  width: 90%;
  box-sizing: border-box;
  background: var(--modal-bg);
  color: var(--text);
  border: 1px solid var(--card-dark);
  border-radius: 10px;
  padding: 6px 12px;
  font-size: 0.95em;
  cursor: pointer;
  height: 40px;
}

/* Board */
#board {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
  max-width: 70%;
  margin: 0 auto;
}
#board.challenge-grid{
  grid-template-columns: repeat(5, minmax(0, 1fr));
  align-items:stretch;
}

.col{display:flex;flex-direction:column;gap:10px;width:210px}
.category-head {
  background: var(--col-head-grad);
  color: #fff;
  padding: 14px;
  border-radius: 12px;
  text-align: center;
  font-weight: 900;
  letter-spacing: .3px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 6px;
  line-height: 1.2em;
  height: 3.6em; /* fixe Höhe */
  overflow: hidden;
}

.category-head.played-category{
  background: linear-gradient(180deg, #d94f96, #a92f74);
  box-shadow: 0 0 14px rgba(233, 96, 164, 0.35);
}

.category-head span {
  display: block;
  width: 100%;
  white-space: normal;
  text-align: center;
  font-size: 1em;
  line-height: 1.1em;
  word-break: break-word;
}

.category-head {
  height: 5.4em;
  border: 1px solid rgba(120, 231, 255, 0.45);
  box-shadow: 0 0 12px rgba(76, 218, 255, 0.22);
}

.question-btn{
  background:var(--card);color:#fff;padding:20px 12px;border-radius:12px;font-weight:900;cursor:pointer;text-align:center;
  box-shadow:0 6px 20px rgba(3,12,30,.2);transition:transform .08s, box-shadow .12s;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  position:relative;
  overflow:visible;
}
.question-btn:hover{transform:translateY(-3px); box-shadow:0 8px 26px rgba(3,12,30,.28)}
.question-btn .onboard-value{font-size:22px;font-weight:900}
.question-btn .challenge-meta{
  font-size:12px;
  line-height:1.2;
  opacity:.96;
  max-width:100%;
  min-height:3.2em;
  display:flex;
  align-items:center;
  justify-content:center;
  word-break:break-word;
  overflow:hidden;
  text-align:center;
}
body[data-board-mode="challenge"] .col.special .category-head{
  background:
    linear-gradient(180deg, rgba(255,113,113,.16), rgba(255,113,113,0) 28%),
    linear-gradient(180deg, #4d0610, #200106);
  color:#fff2f2;
  border:1px solid rgba(255,105,105,.72);
  box-shadow:
    0 0 12px rgba(255,58,58,.32),
    0 0 28px rgba(173,11,34,.38),
    0 0 56px rgba(110,0,0,.24);
  text-shadow:0 0 10px rgba(255,180,180,.2);
}
body[data-board-mode="challenge"] #board.challenge-grid .question-btn{
  width:100%;
  min-height:128px;
  justify-content:center;
  padding:14px 12px;
}
body[data-board-mode="challenge"] .col.special .question-btn{
  background:
    radial-gradient(circle at 50% 18%, rgba(255,118,118,.18), rgba(255,118,118,0) 36%),
    linear-gradient(180deg, #5c0812 0%, #2b0208 60%, #160104 100%);
  color:#fff6f6;
  border:1px solid rgba(255,107,107,.68);
  box-shadow:
    0 0 12px rgba(255,68,68,.34),
    0 0 30px rgba(181,14,40,.44),
    0 0 58px rgba(86,0,0,.32),
    inset 0 0 18px rgba(255,104,104,.08);
  text-shadow:0 0 8px rgba(0,0,0,.55);
}
body[data-board-mode="challenge"] .col.special .question-btn:hover{
  box-shadow:

/* Daily Double Effekte */
.dd-cell{
  background:
    radial-gradient(circle at 50% 22%, rgba(255,247,196,.34) 0%, rgba(255,247,196,0) 34%),
    linear-gradient(180deg, #f6dd85 0%, #ddb548 48%, #a87710 100%) !important;
  color:#1a1406!important;
  border:1px solid rgba(255,241,185,.9);
  box-shadow:
    0 0 0 1px rgba(255,220,110,.55) inset,
    0 0 18px rgba(244,197,66,.42),

}
.dd-cell .onboard-value{
  color:#2f2005!important;
  text-shadow:0 1px 0 rgba(255,247,214,.55);
}
.dd-cell::before,
.dd-cell::after{
  content:"";
  position:absolute;
  inset:-3px;
  border-radius:14px;
  pointer-events:none;
  opacity:0;
}
.dd-cell::before{
  border:1px solid rgba(255,232,150,.65);
  box-shadow:
    0 0 10px rgba(255,219,95,.28),
    0 0 18px rgba(255,219,95,.14);
}
.dd-cell::after{
  background:
    radial-gradient(circle, rgba(255,249,212,.95) 0 1px, transparent 2px) 8% 18% / 22px 22px no-repeat,
    radial-gradient(circle, rgba(255,244,196,.9) 0 1.5px, transparent 2.5px) 92% 22% / 24px 24px no-repeat,
    radial-gradient(circle, rgba(255,248,205,.9) 0 1px, transparent 2px) 14% 84% / 20px 20px no-repeat,
    radial-gradient(circle, rgba(255,241,180,.85) 0 1.5px, transparent 2.5px) 88% 78% / 24px 24px no-repeat,
    radial-gradient(circle, rgba(255,248,210,.88) 0 1px, transparent 2px) 50% 6% / 18px 18px no-repeat,
    radial-gradient(circle, rgba(255,248,210,.88) 0 1px, transparent 2px) 52% 94% / 18px 18px no-repeat;
}
@keyframes ddFlash { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.6)} }
.dd-flash{animation:ddFlash .8s ease 1}
@keyframes ddPulse {
  0%,100%{
    box-shadow:
      0 0 0 1px rgba(255,220,110,.45) inset,
      0 0 14px rgba(244,197,66,.26),
      0 0 24px rgba(244,197,66,.12);
    transform:scale(1);
  }
  50%{
    box-shadow:
      0 0 0 1px rgba(255,226,135,.7) inset,
      0 0 22px rgba(255,211,86,.42),
      0 0 34px rgba(255,211,86,.2);
    transform:scale(1.01);
  }
}
@keyframes ddSparkle {
  0%,100%{opacity:.35; transform:scale(1)}
  50%{opacity:.78; transform:scale(1.02)}
}
.dd-pulse{animation:ddPulse 2.6s ease-in-out infinite}
.dd-pulse::before,
.dd-pulse::after{opacity:1; animation:ddSparkle 2.2s ease-in-out infinite}
.dd-pulse::after{animation-duration:3.1s; animation-delay:.35s}
@keyframes ddModalPulse {
  0%,100%{
    box-shadow:
      0 0 0 1px rgba(255,220,110,.45) inset,
      0 30px 80px rgba(81,54,5,.36),

  50%{

      0 0 0 1px rgba(255,226,135,.7) inset,

}

/* Volume Slider */

/* Reroll Button */
.reroll-btn {
  background: none;
  border: none;
  color: var(--accent);
  font-size: 18px;
  cursor: pointer;
  margin-left: 6px;
  transition: transform 0.2s, color 0.2s;
}
.reroll-btn:hover {
  transform: rotate(90deg);
  color: var(--good);
}
.pick-btn {
  background: none;
  border: none;
  color: var(--accent);
  font-size: 18px;
  cursor: pointer;
  transition: transform 0.2s, color 0.2s;
}
.pick-btn:hover {

}
.category-head {

  align-items: center;
  gap: 6px;

.category-actions{

  align-items:center;
  gap:2px;
}

/* Checklist */
.multiselect-grid{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap:10px;
  width:100%;
  margin-top:12px;
}
.multiselect-option{
  border:1px solid #b6c7e6;
  border-radius:14px;
  padding:14px 16px;
  background:rgba(125,175,255,.08);
  color:var(--text);
  text-align:center;
  cursor:pointer;
  user-select:none;
  transition:transform .15s ease, box-shadow .2s ease, border-color .2s ease, background .2s ease, color .2s ease;
}
.multiselect-option:hover{
  transform:translateY(-1px);
  border-color:var(--btn-2);
}
.multiselect-option.selected{
  border-color:var(--accent);
  background:rgba(244,197,66,.16);
  box-shadow:0 0 16px rgba(244,197,66,.3);
  text-shadow:0 0 8px rgba(255,255,255,.35);
}
#modal.dd-modal .multiselect-option.selected{
  border-color:#69b7ff;
  background:rgba(80,150,255,.18);
  box-shadow:0 0 18px rgba(80,150,255,.42);
  text-shadow:0 0 10px rgba(170,220,255,.55);
}
#modal.dd-modal .pair-box:not(.matched){
  color:#fff;
}
.multiselect-option.correct{
  background:linear-gradient(120deg, #1a5, #3d7);
  color:#fff;
  border-color:transparent;
  box-shadow:0 0 18px rgba(61, 215, 119, .28);
}
.multiselect-option.wrong{
  background:linear-gradient(120deg, #a33, #d55);
  color:#fff;
  border-color:transparent;
  box-shadow:0 0 18px rgba(213, 85, 85, .2);
}
body[data-theme="dark"] .multiselect-option{
  background:rgba(255,255,255,.06);
  border-color:#28456f;
}
.animation-question{
  position:relative;
  width:min(100%, 520px);
  margin:14px auto 10px;
}
#animationStage{
  position:relative;
  width:100%;
  aspect-ratio:16 / 10;
  min-height:240px;
  border-radius:18px;
  border:2px solid rgba(130, 220, 255, 0.45);
  background:
    radial-gradient(circle at top, rgba(255,255,255,0.18), transparent 48%),
    linear-gradient(180deg, rgba(9,35,56,0.94), rgba(13,56,90,0.92));
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,0.12),
    0 12px 24px rgba(0,0,0,0.22);
  overflow:hidden;
}
.animation-stage-inner{
  position:absolute;
  inset:0;
}
.animation-status,
.animation-replay{
  position:absolute;
  z-index:3;
  display:flex;
  align-items:center;
  justify-content:center;
  width:34px;
  height:34px;
  border-radius:999px;
  background:rgba(7, 20, 34, 0.72);
  border:1px solid rgba(255,255,255,0.18);
  box-shadow:0 4px 10px rgba(0,0,0,0.2);
}
.animation-status{
  top:10px;
  left:10px;
  font-size:18px;
}
.animation-status.running{
  animation:animationHourglassSpin 1.6s linear infinite;
}
.animation-replay{
  right:10px;
  bottom:10px;
  font-size:17px;
  color:#fff;
  cursor:pointer;
}
.animation-replay:hover{
  border-color:rgba(255,255,255,0.42);
  transform:scale(1.05);
}
.animation-sprite{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%, -50%);
  font-size:54px;
  line-height:1;
  user-select:none;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,0.3));
  transition:
    left 2s ease-in-out,
    top 2s ease-in-out,
    transform .45s ease,
    opacity .35s ease;
}
.animation-sprite.hidden{
  opacity:0;
  transform:translate(-50%, -50%) scale(.65);
}
.animation-sprite.final-form{
  font-size:64px;
}
.animation-sprite.confused-form{
  font-size:62px;
}
.animation-bubble{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%, -50%);
  font-size:16px;
  line-height:1;
  user-select:none;
  opacity:0;
  pointer-events:none;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,0.22));
}
.animation-bubble.float{
  animation:animationBubbleFloat 1.4s ease-out forwards;
}
.animation-sprite.leaf-ring{
  font-size:24px;
}
.animation-sprite.wiggle{
  animation:animationSpriteWiggle .3s ease-in-out infinite;
}
.animation-sprite.vibrate{
  animation:animationSpriteVibrate .12s linear infinite;
}
.animation-sprite.pulse{
  animation:animationSpritePulse .75s ease-in-out infinite;
}
.animation-sprite.sideways{
  transform:translate(-50%, -50%) rotate(90deg);
}
.animation-hit-text{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%, -50%);
  font-size:40px;
  font-weight:800;
  color:#ff4d4d;
  text-shadow:0 2px 8px rgba(0,0,0,0.35);
  opacity:0;
  pointer-events:none;
}
.animation-hit-text.show{
  opacity:1;
}
@keyframes animationHourglassSpin{
  from{ transform:rotate(0deg); }
  to{ transform:rotate(360deg); }
}
@keyframes animationSpriteWiggle{
  0%, 100%{
    transform:translate(-50%, -50%) rotate(-6deg);
  }
  50%{
    transform:translate(-50%, -50%) rotate(6deg);
  }
}
@keyframes animationSpriteVibrate{
  0%{
    transform:translate(calc(-50% - 1px), calc(-50% - 1px));
  }
  25%{
    transform:translate(calc(-50% + 1px), calc(-50% - 1px));
  }
  50%{
    transform:translate(calc(-50% - 1px), calc(-50% + 1px));
  }
  75%{
    transform:translate(calc(-50% + 1px), calc(-50% + 1px));
  }
  100%{
    transform:translate(calc(-50% - 1px), calc(-50% - 1px));
  }
}
@keyframes animationSpritePulse{
  0%, 100%{
    transform:translate(-50%, -50%) scale(1);
  }
  50%{
    transform:translate(-50%, -50%) scale(1.18);
  }
}
@keyframes animationBubbleFloat{
  0%{
    opacity:0;

const moveNamesRaw = ``;

function normalizeMoveAlias(alias){
	return String(alias || '')
		.replace(/\{\{[^}]*\}\}/g, '')
		.replace(/\[\[([^|\]]*\|)?([^\]]+)\]\]/g, '$2')
		.replace(/\([^)]*\)/g, '')
		.replace(/&#[0-9]+;/g, '')
		.replace(/<\/?br\s*\/?>/gi, '\n')
		.replace(/\s+/g, ' ')
		.trim();
}

const moveNames = moveNamesRaw
	.trim()
	.split(/\r?\n/)
	.flatMap(line => {
		if(!line.startsWith('|') || line.startsWith('|-')) return [];
		const parts = line.split('||');
		if(parts.length < 2) return [];
		return [parts[0].replace(/^\|\s*/, ''), parts[1]]
			.flatMap(cell => cell.split(/<br\s*\/?>/i))
			.map(normalizeMoveAlias)
			.filter(Boolean);
	});

    { key: 'multiselect', label: '☑️ Checklist'},
    { key: 'pairmatch', label: '👬 Pair Match'}
  ];

  // Falls bereits Auswahl gespeichert wurde, übernehmen
  const savedTypes = JSON.parse(localStorage.getItem('jd_cat_selection') || '[]');

  // 5 Dropdowns (4 normale + 1 spezielle)
  for (let i = 0; i < 5; i++) {
    const sel = document.createElement('select');
    sel.className = 'cat-select';
    typeOptions.forEach(opt => {
      const o = document.createElement('option');
      o.value = opt.key;
      o.textContent = opt.label;
      sel.appendChild(o);
    });

    // Wenn vorheriger Wert existiert → übernehmen
    if (savedTypes[i]) sel.value = savedTypes[i];

    // Änderung speichern
    sel.addEventListener('change', () => {
      savedTypes[i] = sel.value;
      localStorage.setItem('jd_cat_selection', JSON.stringify(savedTypes));
    });

    selContainer.appendChild(sel);
  }

  // Ausgewählte Typen holen oder Standard
  const selectedTypes = Array.from(selContainer.querySelectorAll('select')).map(s => s.value);
  
  // Kategorien generieren
  const pickedNames = [];
  chosenCats = selectedTypes.map(type => {
    const cat = chooseCategoryFromPool(getCategoryPoolForType(type), pickedNames, true)
      || chooseCategoryFromPool(getCategoryPoolForType(type), pickedNames, false)
      || getCategoryPoolForType(type)[0];
    if(cat) pickedNames.push(cat.name);
    return cat;
  });

  // Restlicher Teil deiner buildBoard()-Logik bleibt gleich (Kategorien rendern etc.)
  // ↓


  chosenCats.forEach((cat, colIdx)=>{
    const col=document.createElement('div'); col.className='col'+(cat.type?' special':'');
const head = document.createElement('div');
head.className = 'category-head';

const titleSpan = document.createElement('span');
titleSpan.textContent = cat.name;
head.appendChild(titleSpan);

const rerollBtn = document.createElement('button');
rerollBtn.className = 'reroll-btn';
rerollBtn.innerHTML = '🔄';
rerollBtn.title = 'Diese Kategorie neu ziehen';
rerollBtn.onclick = () => rerollCategory(colIdx);
head.appendChild(rerollBtn);

col.appendChild(head);

    const qs=(cat.questions||[]).slice().sort((a,b)=>a.value-b.value);
    qs.forEach((q,i)=>{
      const b=document.createElement('div'); b.className='question-btn';
      const valEl = document.createElement('div'); valEl.className = 'onboard-value'; valEl.textContent = q.value; b.appendChild(valEl);
      b.dataset.col=colIdx; b.dataset.qIndex=i; b.dataset.value=q.value;
      b.addEventListener('mouseenter', ()=> playHover());
      b.addEventListener('click', ()=> onQuestionClick(colIdx,i,b));
      col.appendChild(b);
    });
    board.appendChild(col);
  });

  document.querySelectorAll('#board .col').forEach((col, colIdx) => {
    const oldHead = col.querySelector('.category-head');
    if(oldHead){
      col.replaceChild(createCategoryHeader(chosenCats[colIdx], colIdx), oldHead);
    }
  });
  refreshPlayedCategoryHighlights();

  // Daily Double weighted pick among cols 0..3
  const weights={100:5,200:5,300:10,400:30,500:50};
  const pool=[];
  document.querySelectorAll('.question-btn').forEach(btn=>{
    const col=+btn.dataset.col;
    if(col<4){ const v=+btn.dataset.value; const w=weights[v]||1; for(let i=0;i<w;i++) pool.push(btn); }
  });
  if(pool.length){
    const dd=pool[Math.floor(Math.random()*pool.length)];
    dd.dataset.daily="true";
  }
}

function getAllChallengeCandidates(){
  const merged = [...normalPool, ...Object.values(specialPools).flat()];
  const seen = new Set();
  return merged.filter(cat => {
    if(!cat?.name || seen.has(cat.name)) return false;
    seen.add(cat.name);
    return (cat.questions || []).some(q => Number(q.value) === 500);
  });
}

function buildChallengeBoard(){
  const board = document.getElementById('board');
  const selContainer = document.getElementById('categorySelectors');
  boardQuestionMap = new Map();
  board.classList.add('challenge-grid');
  board.innerHTML = '';
  selContainer.innerHTML = '';

  const candidates = getAllChallengeCandidates().slice().sort(() => Math.random() - 0.5);
  const selectedCats = [];
  while(selectedCats.length < 25 && candidates.length){
    selectedCats.push(candidates.shift());
  }
  const fallbackCats = selectedCats.slice();
  while(selectedCats.length < 25 && fallbackCats.length){
    selectedCats.push(fallbackCats[(selectedCats.length - fallbackCats.length) % fallbackCats.length]);
  }
  chosenCats = [];

  for(let colIdx = 0; colIdx < 5; colIdx++){
    for(let rowIdx = 0; rowIdx < 5; rowIdx++){
      const challengeIndex = (rowIdx * 5) + colIdx;
      const cat = selectedCats[challengeIndex];
      if(!cat) continue;
      const q = (cat.questions || []).find(item => Number(item.value) === 500);
      if(!q) continue;

      const b = document.createElement('div');
      b.className = 'question-btn';
      const metaEl = document.createElement('div');
      metaEl.className = 'challenge-meta';
      metaEl.textContent = `${typeMeta[cat.type || 'normal']?.icon || '❔'} ${cat.name}`;
      b.appendChild(metaEl);
      b.dataset.col = colIdx;
      b.dataset.qIndex = rowIdx;
      b.dataset.value = q.value;
      b.dataset.challengeIndex = challengeIndex;
      b.title = `${cat.name} (${typeMeta[cat.type || 'normal']?.icon || '❔'} ${cat.type || 'normal'})`;
      b.addEventListener('mouseenter', ()=> playHover());
      b.addEventListener('click', ()=> onQuestionClick(colIdx, rowIdx, b));
      board.appendChild(b);
      boardQuestionMap.set(`${colIdx}_${rowIdx}`, { cat, q });
      fitChallengeButtonText(b);
    }
  }
  refreshPlayedCategoryHighlights();
}

function createEmptyHighscoreHistory(){
  return {
    multiplayer: { normal: [], challenge: [] },
    singleplayer: { normal: [], challenge: [] }
  };
}

function getStorageSafeHistory(){
  const base = createEmptyHighscoreHistory();
  ['multiplayer', 'singleplayer'].forEach(mode => {
    const bucket = highscoreHistory?.[mode];
    if(Array.isArray(bucket)){
      base[mode].normal = bucket;
      return;
    }
    if(bucket && typeof bucket === 'object'){
      base[mode].normal = Array.isArray(bucket.normal) ? bucket.normal : [];
      base[mode].challenge = Array.isArray(bucket.challenge) ? bucket.challenge : [];
    }
  });
  return base;
}

function saveHighscoreHistory(){
  localStorage.setItem(HIGHSCORE_HISTORY_KEY, JSON.stringify(getStorageSafeHistory()));
}

function loadHighscoreHistory(){
  try{
    const saved = JSON.parse(localStorage.getItem(HIGHSCORE_HISTORY_KEY) || 'null');
    if(saved && typeof saved === 'object'){
      const nextHistory = createEmptyHighscoreHistory();
      ['multiplayer', 'singleplayer'].forEach(mode => {
        const bucket = saved[mode];
        if(Array.isArray(bucket)){
          nextHistory[mode].normal = bucket;
          return;
        }
        if(bucket && typeof bucket === 'object'){
          nextHistory[mode].normal = Array.isArray(bucket.normal) ? bucket.normal : [];
          nextHistory[mode].challenge = Array.isArray(bucket.challenge) ? bucket.challenge : [];
        }
      });
      highscoreHistory = nextHistory;
    }
  }catch{}
}

function getHistoryForMode(mode = currentMode, boardMode = currentBoardMode){
  return getStorageSafeHistory()[mode]?.[boardMode] || [];
}

function getTopHighscore(mode = currentMode, boardMode = currentBoardMode){
  const list = getHistoryForMode(mode, boardMode);
  return list.length ? list.reduce((best, entry) => entry.score > best.score ? entry : best) : null;
}

function refreshHighscoreUI(){
  const el = document.getElementById('highscoreBadge');
  if(!el) return;
  const top = getTopHighscore(currentMode, currentBoardMode);
  const prefix = `${getModeLabel(currentMode)} ${getBoardModeLabel(currentBoardMode)}`;
  el.textContent = top
    ? `${prefix} Highscore: ${top.score} (${top.name})`
    : `${prefix} Highscore: —`;
}

function deleteHighscoreEntry(mode, boardMode, id){
  highscoreHistory[mode][boardMode] = getHistoryForMode(mode, boardMode).filter(entry => entry.id !== id);
  saveHighscoreHistory();
  refreshHighscoreUI();
  renderHighscoreOverlay();
}

function deleteAllHighscores(mode, boardMode){
  highscoreHistory[mode][boardMode] = [];
  saveHighscoreHistory();

  renderHighscoreOverlay();
}

function resetTopHighscore(mode = activeHistoryTab, boardMode = activeHistoryVariant){

function renderHighscoreOverlay(){
  const modes = [currentMode, currentMode === 'singleplayer' ? 'multiplayer' : 'singleplayer'];
  highscoreTabs.innerHTML = '';
  modes.forEach(mode => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = `highscore-tab${activeHistoryTab === mode ? ' active' : ''}`;
    btn.textContent = getModeLabel(mode);
    btn.onclick = () => {
      activeHistoryTab = mode;
      renderHighscoreOverlay();
    };
    highscoreTabs.appendChild(btn);
  });

  highscoreModeSwitch.innerHTML = '';
  ['normal', 'challenge'].forEach(mode => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = `highscore-tab highscore-mode-pill ${mode}${activeHistoryVariant === mode ? ' active' : ''}`;
    btn.textContent = getBoardModeLabel(mode);
    btn.onclick = () => {
      activeHistoryVariant = mode;
      renderHighscoreOverlay();
    };
    highscoreModeSwitch.appendChild(btn);
  });

  const list = getHistoryForMode(activeHistoryTab, activeHistoryVariant).slice().sort((a,b) => b.score - a.score || b.createdAt.localeCompare(a.createdAt));
  highscoreList.innerHTML = '';
  if(!list.length){
    const empty = document.createElement('div');
    empty.id = 'highscoreEmpty';
    empty.textContent = `Noch keine ${getModeLabel(activeHistoryTab)}-Highscores im ${getBoardModeLabel(activeHistoryVariant)} gespeichert.`;
    highscoreList.appendChild(empty);
  }else{
    list.forEach(entry => {
      const row = document.createElement('div');
      row.className = 'highscore-row';

      const main = document.createElement('div');
      main.className = 'highscore-main';
      const name = document.createElement('div');
      name.className = 'highscore-name';
      name.textContent = entry.name;
      const meta = document.createElement('div');
      meta.className = 'highscore-meta';
      meta.textContent = new Date(entry.createdAt).toLocaleString('de-DE');
      main.appendChild(name);
      main.appendChild(meta);

      const score = document.createElement('div');
      score.className = 'highscore-score';
      score.textContent = entry.score;

      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'btn secondary';
      del.textContent = 'Löschen';
      del.onclick = () => deleteHighscoreEntry(activeHistoryTab, activeHistoryVariant, entry.id);

      row.appendChild(main);
      row.appendChild(score);
      row.appendChild(del);
      highscoreList.appendChild(row);
    });
  }
}

function getQuestionClassifierNames(q){
  if(Array.isArray(q.classifier)){
    return q.classifier.map(name => String(name || '').trim()).filter(Boolean);
  }
  if(q.classifier){
    return [String(q.classifier).trim()].filter(Boolean);
  }
  return [];
}

function getQuestionSuggestionTerms(q, options={}){
  const classifierNames = getQuestionClassifierNames(q);
  const classifierTerms = classifierNames.flatMap(name => classifierLists[name] || []);
  const answerTerms = (options.includeAnswers ?? classifierNames.length > 0)
    ? (q.answers || []).flat().map(String)
    : [];
  const extraTerms = Array.isArray(q.suggestions) ? q.suggestions.map(String) : [];
  const merged = [...classifierTerms, ...answerTerms, ...extraTerms].filter(Boolean);
  const seen = new Set();
  return merged.filter(term => {
    const key = String(term).toLocaleLowerCase('de-DE').normalize('NFKC').trim();
    if(!key || seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

function setupAnswerSuggestions(q, options={}){
  const { minChars = 2, maxMatches = 8 } = options;
  let suggestionBox = document.getElementById('suggestionBox');
  if (!suggestionBox) {
    suggestionBox = document.createElement('div');
    suggestionBox.id = 'suggestionBox';
    suggestionBox.style.display = 'none';
  } else {
    suggestionBox.innerHTML = '';
    suggestionBox.style.display = 'none';
  }
  interaction.appendChild(suggestionBox);

  const source = getQuestionSuggestionTerms(q, options);
  if(!source.length){
    answerInput.oninput = null;
    return;
  }

  answerInput.oninput = () => {
    const val = answerInput.value.trim().toLocaleLowerCase('de-DE');
    suggestionBox.innerHTML = '';
    if (val.length < minChars) {
      suggestionBox.style.display = 'none';
      return;
    }

    const matches = source
      .filter(s => s.toLocaleLowerCase('de-DE').includes(val))
      .sort((a, b) => a.toLocaleLowerCase('de-DE').indexOf(val) - b.toLocaleLowerCase('de-DE').indexOf(val))
      .slice(0, maxMatches);

    if (!matches.length) {
      suggestionBox.style.display = 'none';
      return;
    }

    matches.forEach(s => {
      const item = document.createElement('div');
      item.className = 'suggestion-item';
      item.textContent = s;
      item.onclick = () => {
        answerInput.value = s;
        suggestionBox.style.display = 'none';
        answerInput.focus();
      };
      suggestionBox.appendChild(item);
    });

    suggestionBox.style.display = 'block';
  };
}

function renderAnimationQuestion(q){
  cleanupAnimationQuestion();

  const wrapper = document.createElement('div');
  wrapper.className = 'animation-question';

  const stage = document.createElement('div');
  stage.id = 'animationStage';

  const stageInner = document.createElement('div');
  stageInner.className = 'animation-stage-inner';

  const status = document.createElement('div');
  status.className = 'animation-status';

  const replayBtn = document.createElement('button');
  replayBtn.type = 'button';
  replayBtn.className = 'animation-replay';
  replayBtn.textContent = '↻';
  replayBtn.title = 'Animation erneut abspielen';

  stage.appendChild(stageInner);
  stage.appendChild(status);
  stage.appendChild(replayBtn);
  wrapper.appendChild(stage);
  interaction.appendChild(wrapper);

  const runner = animationDefinitions[q.animation];
  if(typeof runner !== 'function'){
    stageInner.textContent = 'Keine Animation gefunden.';
    setAnimationStatus(status, false);
    replayBtn.disabled = true;
    return;
  }

  const startAnimation = () => {
    if(typeof activeAnimationCleanup === 'function'){
      activeAnimationCleanup();
    }

    let finished = false;
    const timers = [];
    stageInner.innerHTML = '';
    setAnimationStatus(status, true);

    const finish = () => {
      if(finished) return;
      finished = true;
      setAnimationStatus(status, false);
    };

    runner({ stage, stageInner, timers, finish });

    activeAnimationCleanup = () => {
      timers.forEach(timer => clearTimeout(timer));
      stageInner.innerHTML = '';
      setAnimationStatus(status, false);
    };
  };

  replayBtn.onclick = startAnimation;
  startAnimation();
}

  highscoreHistory[mode][currentBoardMode].push({

  });

function recordCompletedGame(){
  if(currentMode === 'singleplayer'){
    pushHighscoreEntry('singleplayer', players[0].name, players[0].score);
    return;
  }
  const [a,b] = players;
  const topScore = Math.max(a.score, b.score);
  const label = a.score === b.score ? `${a.name} & ${b.name}` : (a.score > b.score ? a.name : b.name);
  pushHighscoreEntry('multiplayer', label, topScore);
}

function isCategoryPlayed(catOrName){
  const name = typeof catOrName === 'string' ? catOrName : catOrName?.name;
  return !!name && playedCategoryNames.has(name);
}

function markCategoryPlayed(cat){
  if(cat?.name) playedCategoryNames.add(cat.name);
}

function getCategoryPoolForType(type){
  if(type === 'normal') return normalPool.slice();
  const pool = (specialPools[type] || []).length
    ? specialPools[type]
    : Object.values(specialPools).flat();
  return pool.slice();
}

function chooseCategoryFromPool(pool, excludedNames = [], avoidPlayed = false){
  const available = pool.filter(cat => !excludedNames.includes(cat.name));
  if(!available.length) return null;
  if(!avoidPlayed) return available[Math.floor(Math.random() * available.length)];

  const fresh = available.filter(cat => !isCategoryPlayed(cat));
  const candidates = fresh.length ? fresh : available;
  return candidates[Math.floor(Math.random() * candidates.length)];
}

function refreshPlayedCategoryHighlights(){
  document.querySelectorAll('#board .col').forEach((col, colIdx) => {
    const head = col.querySelector('.category-head');

  });
}

function fitCategoryHeaderText(head){
  const title = head?.querySelector('span');
  if(!title) return;

  title.style.fontSize = '1em';
  let size = 1;
  const minSize = 0.52;
  while((title.scrollHeight > title.clientHeight || title.scrollWidth > title.clientWidth) && size > minSize){
    size -= 0.04;
    title.style.fontSize = `${size}em`;
  }
}

function fitAllCategoryHeaders(){
  document.querySelectorAll('.category-head').forEach(fitCategoryHeaderText);
}

function fitChallengeButtonText(button){
  const meta = button?.querySelector('.challenge-meta');
  if(!meta) return;

  meta.style.fontSize = '12px';
  let size = 12;
  const minSize = 8.5;
  while((meta.scrollHeight > meta.clientHeight || meta.scrollWidth > meta.clientWidth) && size > minSize){
    size -= 0.5;
    meta.style.fontSize = `${size}px`;
  }
}

function getSelectedTypeForColumn(colIdx){
  const currentSelect = document.getElementById('categorySelectors').querySelectorAll('select')[colIdx];
  return currentSelect ? currentSelect.value : 'normal';
}

function getCategoryPoolForColumn(colIdx, options = {}){
  const { includePlayed = true } = options;
  const selectedType = getSelectedTypeForColumn(colIdx);
  const used = chosenCats.filter((c, i) => i !== colIdx).map(c => c.name);
  const fullPool = getCategoryPoolForType(selectedType);
  const pool = fullPool.filter(c => !used.includes(c.name));
  if(includePlayed) return pool.length ? pool : fullPool;
  const fresh = pool.filter(cat => !isCategoryPlayed(cat));
  if(fresh.length) return fresh;
  return pool.length ? pool : fullPool;
}

function renderCategoryColumn(cat, colIdx, preserveDaily = true){
  const oldCol = document.querySelectorAll('.col')[colIdx];
  const isSpecial = !!cat.type;
  const ddBtn = preserveDaily ? document.querySelector('[data-daily="true"]') : null;
  const ddCol = ddBtn ? parseInt(ddBtn.dataset.col) : -1;
  const ddVal = ddBtn ? parseInt(ddBtn.dataset.value) : null;

  const newCol = document.createElement('div');
  newCol.className = 'col' + (isSpecial ? ' special' : '');
  newCol.appendChild(createCategoryHeader(cat, colIdx));

  const qs = (cat.questions || []).slice().sort((a, b) => a.value - b.value);
  qs.forEach((q, i) => {
    const b = document.createElement('div');
    b.className = 'question-btn';
    const valEl = document.createElement('div');
    valEl.className = 'onboard-value';
    valEl.textContent = q.value;
    b.appendChild(valEl);
    b.dataset.col = colIdx;
    b.dataset.qIndex = i;
    b.dataset.value = q.value;
    b.addEventListener('mouseenter', () => playHover());
    b.addEventListener('click', () => onQuestionClick(colIdx, i, b));
    newCol.appendChild(b);
  });

  if (colIdx === ddCol && ddVal !== null) {
    const candidate = newCol.querySelector(`.question-btn[data-value="${ddVal}"]`);
    if (candidate) candidate.dataset.daily = "true";
  }

  const board = document.getElementById('board');
  if(oldCol) board.replaceChild(newCol, oldCol);
  else board.appendChild(newCol);
  chosenCats[colIdx] = cat;
  refreshPlayedCategoryHighlights();
}

function openCategoryPicker(colIdx){
  const pool = getCategoryPoolForColumn(colIdx).slice().sort((a,b)=>a.name.localeCompare(b.name, 'de'));
  categoryPickerSelect.innerHTML = '';
  pool.forEach(cat => {
    const opt = document.createElement('option');
    opt.value = cat.name;
    opt.textContent = cat.name;
    if(isCategoryPlayed(cat)) opt.style.color = '#d94f96';

  });
  if(!pool.length) return;
  pickerColIdx = colIdx;
  categoryPickerSelect.value = chosenCats[colIdx]?.name && pool.some(cat => cat.name === chosenCats[colIdx].name)
    ? chosenCats[colIdx].name
    : pool[0].name;
  categoryPickerOverlay.classList.add('show');
  categoryPickerOverlay.setAttribute('aria-hidden', 'false');
  categoryPickerSelect.focus();

    fanfareDD();
  }

  // rebind submit
  const fresh = submitBtn.cloneNode(true);
  submitBtn.parentNode.replaceChild(fresh, submitBtn);
  submitBtn = fresh;

  const type = cat.type || 'normal';

  if(type==='mc'){
    answerInput.style.display='none';

      const b=document.createElement('button'); b.className='btn secondary'; b.textContent=opt;

  } else if(type==='pattern'){
    answerInput.style.display='none';
    (q.options||[]).forEach(opt=>{
      const b=document.createElement('button'); b.className='btn secondary'; b.textContent=opt;
      b.onclick = ()=> finalizeAnswer(q, opt, btn.dataset.daily==="true");

  } else if(type==='animation'){

    answerInput.focus();
  } else if(type==='estimate'){

    answerInput.onkeypress = e=>{ if(e.key==='Enter'){ submitEstimate(q,btn); e.preventDefault(); } };
    answerInput.placeholder='Zahl eingeben...'; answerInput.focus();
  } else if(type === 'audio') {
  answerInput.style.display = 'block';

  const audioPlayer = document.createElement('audio');

  setupAnswerSuggestions(q);
  
  } else if (type === 'pairmatch') {

  // Linke Spalte (fix)
  const leftCol = document.createElement('div');
  leftCol.style.display = 'flex';
  leftCol.style.flexDirection = 'column';
  leftCol.style.gap = '10px';

  // Rechte Spalte (draggable, zufällig)
  const rightCol = document.createElement('div');
  rightCol.style.display = 'flex';
  rightCol.style.flexDirection = 'column';
  rightCol.style.gap = '10px';

  const pairs = q.pairs;
  const leftItems = pairs.map(p => p[0]);
  const rightItems = pairs.map(p => p[1]);
  const shuffledRight = rightItems.slice();
  for(let i = shuffledRight.length - 1; i > 0; i -= 1){
    const j = Math.floor(Math.random() * (i + 1));
    [shuffledRight[i], shuffledRight[j]] = [shuffledRight[j], shuffledRight[i]];
  }
  const leftMatches = new Map();

  // Linke Boxen (fix, mit Basis-Label in dataset)
  const leftBoxes = [];
  leftItems.forEach((text, i) => {
    const box = document.createElement('div');
    box.className = 'pair-box left';
    box.textContent = text;
    box.dataset.index = i;
    box.dataset.base = text; // Basis-Label für sauberes Überschreiben
    leftCol.appendChild(box);
    leftBoxes.push(box);
  });

  // Rechte Boxen (drag)
  const rightBoxes = [];
  shuffledRight.forEach((text) => {
    const box = document.createElement('div');
    box.className = 'pair-box right';
    box.textContent = text;
    box.draggable = true;
    box.dataset.value = text;

    box.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/plain', box.dataset.value);
      setTimeout(() => box.classList.add('dragging'), 0);
    });

    box.addEventListener('dragend', () => {
      box.classList.remove('dragging');
    });

    rightCol.appendChild(box);
    rightBoxes.push(box);
  });

  const findRightBox = (value) => rightBoxes.find(box => box.dataset.value === value) || null;
  const findLeftBoxByMatch = (value) => leftBoxes.find(box => box.dataset.match === value) || null;
  const clearLeftMatch = (leftBox) => {
    const previousValue = leftBox.dataset.match;
    if(previousValue){
      const previousRight = findRightBox(previousValue);
      if(previousRight){
        delete previousRight.dataset.matchedTo;
        previousRight.classList.remove('matched');
      }
    }
    delete leftBox.dataset.match;
    leftMatches.delete(leftBox.dataset.index);
    leftBox.classList.remove('matched');
    leftBox.textContent = leftBox.dataset.base || leftBox.textContent.split(' →')[0];
  };

  // Drop-Ziele: linke Spalte
  leftBoxes.forEach(left => {
    left.addEventListener('dragover', e => e.preventDefault());

    left.addEventListener('drop', e => {
      e.preventDefault();
      const value = e.dataTransfer.getData('text/plain');
      const draggedRight = findRightBox(value);
      const previousLeft = value ? findLeftBoxByMatch(value) : null;

      if(previousLeft && previousLeft !== left){
        clearLeftMatch(previousLeft);
      }

      if(left.dataset.match && left.dataset.match !== value){
        clearLeftMatch(left);
      }

      left.dataset.match = value;
      leftMatches.set(left.dataset.index, value);
      left.classList.add('matched');
      if(draggedRight){
        draggedRight.dataset.matchedTo = left.dataset.index;
        draggedRight.classList.add('matched');
      }

      // Einschnappen
      left.animate(
        [{ transform: 'scale(1)' }, { transform: 'scale(1.08)' }, { transform: 'scale(1)' }],
        { duration: 250, easing: 'ease-out' }
      );

      // Text sauber setzen (kein mehrfaches "→")
      const base = left.dataset.base || left.textContent.split(' →')[0];
      left.textContent = `${base} → ${value}`;
    });
  });

  grid.appendChild(leftCol);
  grid.appendChild(rightCol);
  interaction.appendChild(grid);

  // ✅ WICHTIG: submitBtn statt okButton benutzen
  submitBtn.onclick = () => {
    let correct = 0;

    leftCol.querySelectorAll('.pair-box.left').forEach((left, i) => {
      const expected = pairs[i][1];
      const matched = leftMatches.get(String(i)) || left.dataset.match;

      if (matched === expected) {
        left.style.background = 'linear-gradient(120deg, #1a5, #3d7)';
        left.style.color = '#fff';
        correct++;
      } else {
        left.style.background = 'linear-gradient(120deg, #a33, #d55)';
        left.style.color = '#fff';
      }
    });

    // Drag deaktivieren
    rightCol.querySelectorAll('.pair-box.right').forEach(r => r.draggable = false);

    // 2 Sekunden offen lassen, dann werten (Alles-oder-Nichts)
    setTimeout(() => {
      finalizeBinary(q, correct === pairs.length, btn.dataset.daily === "true");
    }, 2000);
  };
} else if(type==='stakkato'){
    stakkatoState={found:[], scoreSoFar:0};
    const per=Math.round(q.value/(q.answers.length||1)), malus=Math.round(q.value/2);
    const info=document.createElement('div');
    info.innerHTML=`<small>Stakkato! +${per} pro richtige Antwort, falsch: -${malus} (endet sofort).</small>

  (q.options || []).forEach((opt, idx) => {

} else if(type==='image_mc'){

  interaction.appendChild(list);

 submitBtn.onclick = () => {
  const norm = (s) => String(s || '').toLocaleLowerCase('de-DE').normalize('NFKC').trim();
  const correctSet = new Set((q.correct || []).map(norm));

  let allCorrect = true;

  choices.forEach(option => {
    const valNorm = norm(option.dataset.value);
    const isCorrect = correctSet.has(valNorm);
    const isChecked = option.dataset.selected === 'true';

    option.disabled = true;
    option.classList.remove('selected', 'correct', 'wrong');
    if (isCorrect && isChecked) {
      option.classList.add('correct');
    } else if (!isCorrect && isChecked) {
      option.classList.add('wrong');
      allCorrect = false;
    } else if (isCorrect && !isChecked) {
      option.classList.add('correct');
      allCorrect = false;
    }

    if (isCorrect !== isChecked) {
      allCorrect = false;
    }
    return;

    // Symbole rechts
    if (isCorrect && isChecked) {
      ch.resultSpan.textContent = "✓";
      ch.resultSpan.style.color = "limegreen";
    } else if (!isCorrect && isChecked) {
      ch.resultSpan.textContent = "✗";
      ch.resultSpan.style.color = "red";

      ch.resultSpan.textContent = "✓";
      ch.resultSpan.style.color = "yellow";
      allCorrect = false;
    } else {
      ch.resultSpan.textContent = "";
    }

    // Zeilenexaktheit
    if (isCorrect !== isChecked) {
      allCorrect = false;

  });

  // 2s offen lassen, dann binär werten (ohne finalizeAnswer)

/* normal/mc/pattern/image */
function submitAnswerGeneric(q, btn){
  finalizeAnswer(q, answerInput.value.trim(), btn.dataset.daily==="true");
}
function finalizeAnswer(q, given, isDaily){
  const flat=(q.answers||[]).flat().map(x=>String(x).toLowerCase());
  const ok = isDebugCorrectAnswer(given) || flat.includes(String(given||'').toLowerCase());
  const base=+q.value||0, delta=(ok?base:-base)*(isDaily?2:1);
  updateScore(delta, ok);
  if(!ok) showCorrectList(q);
  markAnswered(currentCell);
  if(ok){
    setTimeout(()=> closeModal(), 900);
    setTimeout(()=> nextPlayer(), 950);
  }else{
    waitForDismissAfterReveal();
  }
}

// Für Spezialtypen mit binärer Auswertung (ok=true/false)
function finalizeBinary(q, ok, isDaily){
  const base = +q.value || 0;
  const delta = (ok ? base : -base) * (isDaily ? 2 : 1);

  updateScore(delta, ok);

  // Bei falsch: richtige Lösung(en) zeigen (z. B. für multiselect)
  if(!ok && Array.isArray(q.correct)){
    const box = document.createElement('div');
    box.className = 'correct-list';
    box.innerHTML = `<b>Richtige Auswahl:</b><div>${q.correct.join(', ')}</div>`;
    correctArea.appendChild(box);
  }

  markAnswered(currentCell);
  if(ok){
    setTimeout(()=> closeModal(), 900);
    setTimeout(()=> nextPlayer(), 950);
  }else{
    waitForDismissAfterReveal();
  }
}


/* Stakkato */
function stakkatoSubmit(q, btn){
  const val=String(answerInput.value||'').trim();
  if(!val) return;
  if(isDebugCorrectAnswer(val)){
    stakkatoState.scoreSoFar += Math.round(q.value/(q.answers.length||1));
    finalizeStakkato(q, btn);
    return;
  }
  let idx=-1;
  for(let i=0;i<q.answers.length;i++){
    const variants=Array.isArray(q.answers[i])?q.answers[i].map(v=>String(v).toLowerCase()):[String(q.answers[i]).toLowerCase()];
    if(variants.includes(val.toLowerCase())){ idx=i; break; }
  }
  const per=Math.round(q.value/(q.answers.length||1)), malus=Math.round(q.value/2);
  const list=document.getElementById('stakList');
  if(idx>=0){
    if(!stakkatoState.found.includes(idx)){
      stakkatoState.found.push(idx);
      stakkatoState.scoreSoFar += per;
      const li=document.createElement('div'); li.textContent=val+" ✓"; li.style.color='green'; list.appendChild(li);
      stakkatoStep(stakkatoState.found.length, q.answers.length);
    }else{
      const li=document.createElement('div'); li.textContent=val+" (bereits genannt)"; li.style.color='#667'; list.appendChild(li);
    }
  }else{
    stakkatoState.scoreSoFar -= malus;
    const li=document.createElement('div'); li.textContent=val+" ✖ (Stakkato beendet)"; li.style.color='crimson'; list.appendChild(li);
    finalizeStakkato(q, btn);
    return;
  }
  const frac = stakkatoState.found.length/(q.answers.length||1);
  const float=document.getElementById('stakFloat');
  float.textContent=stakkatoState.scoreSoFar;
  float.style.color=`hsl(${Math.min(120,frac*120)},80%,40%)`;
  document.getElementById('stakCounter').textContent = `${stakkatoState.found.length} / ${q.answers.length}`;
  answerInput.value=''; answerInput.focus();
  if(stakkatoState.found.length >= q.answers.length){
    finalizeStakkato(q, btn);
  }
}
function finalizeStakkato(q, btn){
  const daily = btn.dataset.daily==="true";
  const awarded = (stakkatoState.scoreSoFar||0)*(daily?2:1);
  updateScore(awarded, awarded>0);
  showCorrectList(q);
  markAnswered(currentCell);
  stakkatoState=null;
  setTimeout(()=> closeModal(), 1000);
  setTimeout(()=> nextPlayer(), 1050);
  // Listener sauber entfernen und Box verstecken
answerInput.oninput = null;
const sb = document.getElementById('suggestionBox');
if (sb) { sb.style.display = 'none'; sb.innerHTML = ''; }

/* Estimate (Schätzen) */
function submitEstimate(q, btn){
  if(estimatePhase===0){
    const raw = String(answerInput.value||'').replace(',','.');
    if(isDebugCorrectAnswer(raw)){
      const correct = Number(q.answers[0][0] || q.answers[0]);
      updateScore(btn.dataset.daily==="true" ? q.value * 2 : q.value, true);
      renderEstimateBar(correct, correct);
      estimatePhase=1;
      return;
    }
    const guess = parseFloat(raw);
    if(isNaN(guess)) return;
    const correct = Number(q.answers[0][0] || q.answers[0]);
    const diff = Math.abs(guess-correct);
    const rel  = correct===0 ? (diff>0?1:0) : diff/Math.abs(correct);
    let pts=0;
    if(diff===0) pts=q.value;
    else if(rel<=0.05) pts=Math.round(q.value*0.8);
    else if(rel<=0.10) pts=Math.round(q.value*0.6);
    else if(rel<=0.20) pts=Math.round(q.value*0.3);
    else pts=-Math.round(q.value*0.2);
    if(btn.dataset.daily==="true") pts*=2;

    updateScore(pts, pts>0);
    renderEstimateBar(correct, guess);
    estimatePhase=1;
  }else{
    estimatePhase=0;
    markAnswered(currentCell);
    closeModal();
    nextPlayer();
  }
}

function renderEstimateBar(correct, guess){
  interaction.innerHTML = '';

  const c = Math.abs(Number(correct) || 0);
  const g = Math.abs(Number(guess) || 0);

  const min = 0;
  const max = Math.max(2 * c, g, 1); // mindestens 1, um Division zu vermeiden

  let pctCorrect = ((c - min) / (max - min)) * 100;
  let pctGuess   = ((g - min) / (max - min)) * 100;

  pctCorrect = Math.max(0, Math.min(100, pctCorrect));
  pctGuess   = Math.max(0, Math.min(100, pctGuess));

  const wrap = document.createElement('div');
  wrap.className = 'estimate-wrap';

  const bar = document.createElement('div');
  bar.className = 'estimate-bar';
  wrap.appendChild(bar);

  const ptr = document.createElement('div');
  ptr.className = 'estimate-pointer';
  ptr.textContent = '▲';
  ptr.style.left = `${pctGuess}%`;
  bar.appendChild(ptr);

  const dot = document.createElement('div');
  dot.className = 'estimate-correct';
  dot.textContent = '●';
  dot.style.left = `${pctCorrect}%`;
  bar.appendChild(dot);

  const lbl = document.createElement('div');
  lbl.style.marginTop = '10px';
  lbl.textContent = `Richtig: ${correct} — Deine Schätzung: ${guess}`;
  wrap.appendChild(lbl);

  interaction.appendChild(wrap);
}

function renderEstimateBar(correct, guess){
  interaction.innerHTML = '';

  const c = Number(correct) || 0;
  const g = Number(guess) || 0;
  const diff = g - c;
  const relError = c === 0 ? (diff === 0 ? 0 : Math.sign(diff)) : diff / Math.abs(c);
  const clampedError = Math.max(-1, Math.min(1, relError));
  const pctGuess = 50 + clampedError * 50;

  const wrap = document.createElement('div');
  wrap.className = 'estimate-wrap';

  const bar = document.createElement('div');
  bar.className = 'estimate-bar';
  wrap.appendChild(bar);

  const mid = document.createElement('div');
  mid.className = 'estimate-midline';
  bar.appendChild(mid);

  const ptr = document.createElement('div');
  ptr.className = 'estimate-pointer';
  ptr.textContent = '▲';
  ptr.style.left = `${pctGuess}%`;
  bar.appendChild(ptr);

  const dot = document.createElement('div');
  dot.className = 'estimate-correct';
  dot.textContent = 'Richtig';
  dot.style.left = '50%';
  bar.appendChild(dot);

  const labels = document.createElement('div');
  labels.className = 'estimate-labels';
  labels.innerHTML = `<span>zu niedrig</span><span>perfekt</span><span>zu hoch</span>`;
  wrap.appendChild(labels);

  const summary = document.createElement('div');
  summary.className = 'estimate-summary';
  const absDiff = Math.abs(diff);
  const relPct = c === 0 ? (absDiff === 0 ? 0 : 100) : Math.abs(relError) * 100;
  summary.textContent = `Richtig: ${correct} | Deine Schätzung: ${guess} | Abweichung: ${absDiff}${c === 0 ? '' : ` (${relPct.toFixed(1)}%)`}`;
  wrap.appendChild(summary);

  interaction.appendChild(wrap);
}

/* Score & helpers */
function getComboVisualLevel(streak){
  if(streak <= 0) return 0;
  if(streak >= 25) return 25;
  return streak;
}
function refreshComboUI(){
  players.forEach((player, idx) => {
    const el = document.getElementById(`combo${idx}`);
    if(!el) return;
    el.className = 'combo-badge';
    if(currentMode === 'singleplayer'){
      el.textContent = '';
      return;
    }
    if(player.streak <= 0){
      el.textContent = '';
      return;
    }
    const level = getComboVisualLevel(player.streak);
    el.textContent = `Kombo: ${player.streak}`;
    el.classList.add('show', `combo-${level}`);
  });
}

function refreshSingleplayerStreakUI(){
  const valueEl = document.getElementById('singleStreakValue');
  const wrapEl = document.getElementById('singleStreakDisplay');
  if(!valueEl || !wrapEl) return;
  if(currentMode !== 'singleplayer'){
    valueEl.textContent = 'x0';
    wrapEl.className = 'single-streak-display';
    return;
  }
  const streak = Math.max(0, players[0].streak || 0);
  valueEl.textContent = `x${streak}`;
  wrapEl.className = 'single-streak-display';
  if(streak > 1){
    wrapEl.classList.add(`combo-${getComboVisualLevel(streak)}`);
  }
}

function updateScore(delta, positive){
  players[activePlayer].score += delta;
  players[activePlayer].streak = positive ? players[activePlayer].streak + 1 : 0;
  document.getElementById('pscore0').textContent = players[0].score;
  document.getElementById('pscore1').textContent = players[1].score;
  refreshComboUI();
  refreshSingleplayerStreakUI();
  showPointsPopup(delta, positive);
  if(positive) playRight(); else playWrong();
}
function showPointsPopup(pts, positive){
  const el=document.getElementById('pointsPopup');
  el.textContent = (pts>0?'+':'') + pts;
  el.style.color = positive? 'var(--good)' : 'var(--bad)';
  el.style.display='block';
  setTimeout(()=>{ el.style.display='none'; }, 900);
}
function showCorrectList(q){
  const box=document.createElement('div'); box.className='correct-list';
  const strings=(q.answers||[]).map(g => Array.isArray(g)? g[0] : g);
  box.innerHTML = `<b>Richtige Antwort(en):</b><div>${strings.join(', ')}</div>`;
  correctArea.appendChild(box);
}
function markAnswered(cell){
  if(!cell) return;
  cell.classList.add('answered');
  cell.classList.remove('selected');
  if(cell.dataset.daily==="true"){ cell.classList.add('dd-cell'); cell.classList.remove('dd-pulse','dd-flash'); }
  markCategoryPlayed(currentCat);
  refreshPlayedCategoryHighlights();
  answeredCount++;
  if(answeredCount >= 25) showWinner();
}
function nextPlayer(){
  if(currentMode === 'singleplayer'){
    activePlayer = 0;
    refreshPlayersUI();
    return;
  }
  activePlayer=(activePlayer+1)%players.length;
  refreshPlayersUI();
}
function showWinner(){
  recordCompletedGame();
  const m=document.getElementById('endModal');
  const [a,b]=players;
  let txt='Unentschieden!';
  if(currentMode === 'singleplayer'){
    txt=`${a.name} beendet die Runde mit ${a.score} Punkten!`;

  m.textContent=txt; m.style.display='block';
  playEnd();
}

}

  // Spalte neu aufbauen

  head.className = 'category-head';

  }

  // Im Board ersetzen
  const board = document.getElementById('board');

  chosenCats[colIdx] = newCat;
  }
}
