name: Keep Supabase active

on:
  schedule:
    - cron: "17 3,11,19 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase database
        run: |
          curl --fail --silent --show-error \
            --request POST \
            "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/keep_alive" \
            --header "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" \
            --header "Authorization: Bearer ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" \
            --header "Content-Type: application/json" \
            --data '{}'
